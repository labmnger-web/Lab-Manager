<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de vest. e equip. - LabManager</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/equipamentos.css">
    
</head>
<body>

    <header class="header-content">
        <div class="header-logo">
            <a href="../html/index.html">
                <img src="../img/logo.png" alt="Logo">
            </a>
        </div>
    </header>

    <div class="page-content">
        <aside class="sidebar">
            <div class="menu-container">
                <button id="menu-button">☰</button>
                  <div id="menu" class="menu">
                    <a href="../html/pag-agendamentos.html">Agendamentos</a>
                    <a href="../html/pag-vidrarias.html">Vidrarias</a>
                    <a href="../html/pag-reagentes.html">Reagentes</a>
                    <a href="../html/pag-equipamentos.html">Equipamentos</a>
                     <a href="../html/pag-equipamentos.html">Histórico Geral</a>
                </div>
            </div>
        </aside>

        <main class="main-content">
           <h1 class="titulo-cadastro">Cadastro de equipamentos</h1>

           <form class="cadastro-form">
                <label for="vidraria"> Equipamentos ou vestimentas:</label>
                <input type="text" id="equipamento" name="equipamento"
                    placeholder="Informe o equipamento ou a vestimenta" required>

                <label for="armario">Armário:</label>
                <input type="text" id="armario" name="armario"
                    placeholder="Digite o armário" required>

                <button type="submit">Cadastrar</button>
            </form>
        </main>
    </div>

    <footer class="footer">
        <p>Contato: labmnger@gmail.com</p>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
