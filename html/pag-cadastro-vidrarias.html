<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de vidrarias - LabManager</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/vidrarias.css">
</head>
<body>

    <header class="header-content">
        <div class="header-logo">
            <a href="../html/index.html">
                <img src="../img/logo.png" alt="Logo">
            </a>
        </div>
    </header>

    <div class="page-content">
        <aside class="sidebar">
            <div class="menu-container">
                <button id="menu-button">☰</button>
                  <div id="menu" class="menu">
                    <a href="../html/pag-agendamentos.html">Agendamentos</a>
                    <a href="../html/pag-vidrarias.html">Vidrarias</a>
                    <a href="../html/pag-reagentes.html">Reagentes</a>
                    <a href="../html/pag-equipamentos.html">Equipamentos</a>
                     <a href="../html/pag-equipamentos.html">Histórico Geral</a>
                </div>
            </div>
        </aside>

        <main class="main-content">
           <h1 class="titulo-cadastro">Cadastro de vidrarias</h1>

           <form class="cadastro-form">
                <label for="vidraria">Vidraria:</label>
                <input type="text" id="vidraria" name="vidraria"
                    placeholder="Digite o nome da vidraria" required>

                <label for="capacidade">Capacidade:</label>
                <input type="number" id="capacidade" name="capacidade"
                    placeholder="Digite a capacidade" required>

                <label for="unidade">Unidade de medida:</label>
                <input type="text" id="unidade" name="unidade"
                    placeholder="Ex: mL, L" required>

                <label for="material">Material:</label>
                <input type="text" id="material" name="material"
                    placeholder="Digite o material" required>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" name="quantidade"
                    placeholder="Digite a quantidade" required>

                <button type="submit">Cadastrar</button>
            </form>
        </main>
    </div>

    <footer class="footer">
        <p>Contato: labmnger@gmail.com</p>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
